[package]
name = "kdtube-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Low-memory native core for KDTube: zero-copy JSON index + Jayway-compatible JsonPath evaluator, exposed over JNI"
license = "MIT"
publish = false

[lib]
name = "kdtube_core"
# cdylib -> libkdtube_core.so for Android (loaded through System.loadLibrary("kdtube_core"))
# rlib   -> unit/integration tests and benches on the host
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned: the JNI surface (JNIEnv/JByteArray/...) changed in 0.22.
jni = { version = "=0.21.1", default-features = false }
memchr = "2"
oxc_allocator = "0.153.0"
oxc_ast = "0.153.0"
oxc_ast_visit = "0.153.0"
oxc_parser = "0.153.0"
oxc_span = "0.153.0"
oxc_syntax = "0.153.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# NOTE: keep panic = "unwind". Every JNI entry point wraps its body in
# catch_unwind so that a bug can never abort the whole app process; Java just
# falls back to the pure-Java engine when the native call reports an error.

# Used by the memory-measurement example so that "peak heap" is a real number.
[profile.bench]
inherits = "release"
debug = false
