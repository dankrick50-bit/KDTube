# Android 15+ can run with 16 KB memory pages and then refuses to load 64-bit
# libraries whose segments are aligned to 4 KB only.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
